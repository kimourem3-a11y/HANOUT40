<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="4" filter="url(#dropShadow)" />

  <!-- Inner Emerald Border Accent -->
  <rect x="36" y="36" width="440" height="440" rx="96" fill="none" stroke="url(#emeraldGrad)" stroke-width="3" stroke-opacity="0.4" />

  <!-- Awning / Canopy of Store -->
  <g transform="translate(96, 90)">
    <!-- Roof Awning Striped -->
    <path d="M 16 70 L 40 10 L 280 10 L 304 70 Z" fill="#047857" />
    <!-- Awning Scallops -->
    <path d="M 16 70 Q 36 95 56 70 Q 76 95 96 70 Q 116 95 136 70 Q 156 95 176 70 Q 196 95 216 70 Q 236 95 256 70 Q 276 95 304 70 Z" fill="url(#emeraldGrad)" />
    
    <!-- Stripes on awning -->
    <path d="M 76 10 L 76 70 M 136 10 L 136 70 M 196 10 L 196 70 M 256 10 L 256 70" stroke="#065f46" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- POS Terminal & Cash Drawer / Store Front -->
  <g transform="translate(116, 195)">
    <!-- Main Terminal Body -->
    <rect x="20" y="20" width="240" height="170" rx="20" fill="#1e293b" stroke="#475569" stroke-width="4" />
    
    <!-- POS Screen -->
    <rect x="40" y="35" width="200" height="110" rx="12" fill="url(#screenGrad)" stroke="#10b981" stroke-width="3" />
    
    <!-- Screen Display Data & "H40" -->
    <text x="140" y="80" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">H40</text>
    <text x="140" y="112" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#34d399" text-anchor="middle" letter-spacing="4">HANOUTI</text>

    <!-- Cash Register Drawer / Base -->
    <path d="M 0 190 L 280 190 L 265 240 L 15 240 Z" fill="#0f172a" stroke="#334155" stroke-width="4" />
    <!-- Drawer Handle / Bill Slot -->
    <rect x="90" y="208" width="100" height="8" rx="4" fill="url(#amberGrad)" />
    <!-- Keyhole / Status LED -->
    <circle cx="230" cy="212" r="5" fill="#10b981" />
  </g>

  <!-- Golden 40 Badge in Corner -->
  <g transform="translate(340, 340)">
    <circle cx="45" cy="45" r="46" fill="#0f172a" stroke="url(#amberGrad)" stroke-width="5" filter="url(#dropShadow)" />
    <circle cx="45" cy="45" r="38" fill="url(#amberGrad)" />
    <text x="45" y="55" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#1e293b" text-anchor="middle">PRO</text>
  </g>
</svg>
